[build]
  command = "npm run build"
  publish = "dist"

# API goes through Netlify so the login cookie is first-party.
# In Netlify env set VITE_API_BASE_URL=/api (or delete it).
[[redirects]]
  from = "/api/*"
  to = "https://fish-project-zwv0.onrender.com/api/:splat"
  status = 200
  force = true

# Single page app: deep links like /trips/5 must load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
